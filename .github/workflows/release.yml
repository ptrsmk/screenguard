name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross --locked

      - name: Set version from tag
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          sed -i "s/^version = \".*\"/version = \"${VERSION}\"/" crates/agent/Cargo.toml
          sed -i "s/^version = \".*\"/version = \"${VERSION}\"/" crates/server/Cargo.toml

      - name: Build agent
        run: cross build --release -p agent --target ${{ matrix.target }}

      - name: Build server
        run: cross build --release -p server --target ${{ matrix.target }}

      - name: Build tray
        run: cross build --release -p tray --target ${{ matrix.target }}

      - name: Stage binaries
        run: |
          ARCH=$(echo "${{ matrix.target }}" | cut -d- -f1)
          mkdir -p dist
          cp target/${{ matrix.target }}/release/agent                    dist/screenguard-agent-${ARCH}
          cp target/${{ matrix.target }}/release/parental-controller-server dist/screenguard-server-${ARCH}
          cp target/${{ matrix.target }}/release/screenguard-tray          dist/screenguard-tray-${ARCH}
          chmod +x dist/screenguard-agent-${ARCH} dist/screenguard-server-${ARCH} dist/screenguard-tray-${ARCH}
          sha256sum dist/screenguard-agent-${ARCH}  | awk '{print $1}' > dist/screenguard-agent-${ARCH}.sha256
          sha256sum dist/screenguard-server-${ARCH} | awk '{print $1}' > dist/screenguard-server-${ARCH}.sha256
          sha256sum dist/screenguard-tray-${ARCH}   | awk '{print $1}' > dist/screenguard-tray-${ARCH}.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: dist/

  release:
    name: Publish release
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Bundle deploy files
        run: |
          cp deploy/screenguard-server.service dist/
          cp deploy/screenguard-agent.service  dist/
          cp deploy/screenguard-webui.service  dist/
          cp deploy/screenguard-tray.desktop   dist/
          cp deploy/screenguard-dbus.conf      dist/
          cp install.sh dist/
          # A fork's installer defaults to the fork's own releases.
          sed -i "s|:-adambie/screenguard}|:-${GITHUB_REPOSITORY}}|" dist/install.sh
          grep -qF "REPO=\"\${SCREENGUARD_REPO:-${GITHUB_REPOSITORY}}\"" dist/install.sh
          tar -czf dist/screenguard-webui.tar.gz \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            -C webui .
          # Proxmox LXC scripts (deploy/proxmox), also defaulting to this repo.
          for f in pve-screenguard screenguard-update; do
            cp "deploy/proxmox/$f" dist/
            sed -i "s|:-adambie/screenguard}|:-${GITHUB_REPOSITORY}}|" "dist/$f"
            grep -qF ":-${GITHUB_REPOSITORY}}" "dist/$f"
          done
          for f in screenguard-webui.tar.gz pve-screenguard screenguard-update; do
            sha256sum "dist/$f" | awk '{print $1}' > "dist/$f.sha256"
          done

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          generate_release_notes: true

  docker:
    name: Publish Docker images (GHCR)
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      # GHCR image names must be lowercase; forks publish under their own owner.
      - name: Image prefix
        run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The server image wraps the release binaries uploaded by the job above
      # (Dockerfile.server downloads them by tag), so it must run after `release`.
      - name: Server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.server
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ github.ref_name }}
            REPO=${{ github.repository }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/screenguard-server:${{ github.ref_name }}
            ${{ env.IMAGE_PREFIX }}/screenguard-server:latest

      - name: Web UI image
        uses: docker/build-push-action@v6
        with:
          context: webui
          file: deploy/Dockerfile.webui
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/screenguard-webui:${{ github.ref_name }}
            ${{ env.IMAGE_PREFIX }}/screenguard-webui:latest
